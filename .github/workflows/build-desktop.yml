name: build-desktop

# 你没有 Windows 机器也能拿到 .exe：
#   1. 把项目推到 GitHub
#   2. Actions 里手动跑一次 build-desktop
#   3. 在 Artifacts 里下载 PP6ImportBuilder-windows.zip
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: PP6ImportBuilder-windows
            folder: dist/PP6ImportBuilder
          - os: macos-latest
            artifact: PP6-import-builder-macos
            folder: dist/PP6 导入包生成器.app

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt

      - name: 打包
        run: pyinstaller build/pp6.spec --noconfirm --distpath dist --workpath build/work

      - name: 冒烟测试（仅 macOS/Linux 支持该语法）
        if: runner.os != 'Windows'
        run: |
          "./${{ matrix.folder }}/Contents/MacOS/PP6ImportBuilder" --headless --port 8899 &
          sleep 5
          curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8899/api/template | grep -q 200

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.folder }}
          retention-days: 30
