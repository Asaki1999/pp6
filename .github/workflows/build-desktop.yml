name: build-desktop

# 打包 Windows + macOS 并发布到 Release（公开附件可匿名下载，不必登录）：
#   - push 到 main（含每日定时提交）→ 滚动更新 nightly prerelease，同事永远从同一链接拿最新版
#   - 推 v* tag → 正式版 Release，设为 Latest、保留版本号
#   - 推 test* tag（test0.01、test0.02…）→ 测试发版 Release，设为 Latest、按 tag 名保留版本
# 三条路径共用下面这一个 build job；build 之前先过 regress（回归不过不发版）。
on:
  workflow_dispatch:
  push:
    # 04:00 的 WorkBuddy 定时任务只有检测到本地改动才会 push；
    # 没有改动就没有 push，也就不会空转打包。
    branches:
      - main
    tags:
      - "v*"
      - "test*"

permissions:
  contents: write      # 发布 Release 需要写权限

jobs:
  # 发版闸：回归不过就不打包。以前流水线只有密钥扫描 + 冒烟，621 条回归
  # 没拦在任何发版前面，而每天都会自动打 test0.NN 发版（2026-11-24 补上）。
  # 单独一个 ubuntu job 而不是塞进打包矩阵：只跑一遍、约 20 秒，
  # 且避开 Windows 控制台编码坑（check_secrets 在那上面踩过）。
  # 原生样本目录 PP6/ 不入库，依赖它的用例在 CI 上会 skip，本地仍然是全量。
  regress:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 跳过不算失败（CI 上没有原生样本），有失败就阻断下面的 build。
      - name: 回归测试
        shell: bash
        run: |
          set -o pipefail
          python tools/regress.py 2>&1 | tee regress.log

      # 失败时把末尾日志写进 job summary：公开仓库的 Actions 日志要登录才能看，
      # 摘要不用；排查 CI-only 失败（本地绿、Ubuntu 红）时少一次「加日志再推」。
      - name: 回归失败摘要
        if: failure()
        shell: bash
        run: |
          {
            echo "## 回归失败明细"
            echo '```'
            tail -n 160 regress.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 摘要网页端要展开才看得到；注解（annotation）在 check-run API 里也能读，
      # 正好给「没有 gh、只有公开 API」的排查场景用。
      - name: 回归失败注解
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("regress.log").read_text(encoding="utf-8", errors="replace")
          tail = text.split("失败明细：")[-1] if "失败明细：" in text else text[-2000:]
          for line in [x.strip() for x in tail.splitlines() if x.strip()][:30]:
              safe = line.replace("%", "%25").replace("\n", "%0A")
              print(f"::error title=回归失败::{safe}")
          PY

  build:
    needs: regress
    # Windows runner 的控制台默认 cp1252：stamp_version.py 打印中文会
    # UnicodeEncodeError（exit 1），打包还没开始就红。统一 UTF-8。
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: PP6ImportBuilder-windows
            folder: dist/PP6ImportBuilder
          - os: macos-latest
            artifact: PP6-Studio-macos
            folder: 'dist/PP6 Studio.app'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与本机已验证的打包环境一致（本机 .venv: Python 3.13.12）
          python-version: "3.13"

      # 挡住误提交的明文 Key（2026-11-18 排查过一次“以为推到 GitHub”）
      # 必须放在 setup-python 之后：Windows runner 系统 python 是商店存根，
      # 直接 python xxx 会 exit 1，扫不出东西也让整个 job 红掉（2026-11-19）。
      - name: 密钥扫描
        run: python tools/check_secrets.py

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt

      # 版本号必须来自「这次构建实际是什么」：tag 用 tag 名，main 用日期。
      # 关于页、更新检查、日志排查都读这份指纹；写死常量会三处对不上。
      - name: 写入构建版本
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
            CHANNEL="release"
          else
            VERSION="nightly-$(date -u +%Y%m%d)"
            CHANNEL="nightly"
          fi
          python tools/stamp_version.py --version "$VERSION" \
            --commit "${GITHUB_SHA:0:7}" --channel "$CHANNEL" \
            --repo "$GITHUB_REPOSITORY"

      - name: 打包
        run: pyinstaller build/pp6.spec --noconfirm --distpath dist --workpath build/work

      # 打包"成功"但产物残缺是历史坑：Windows 少了 _internal 双击就报缺 dll。
      # 在做冒烟测试前先把结构钉死，失败就早停，别上传空壳 Artifact。
      - name: 校验产物结构
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            test -f "dist/PP6ImportBuilder/PP6ImportBuilder.exe"
            test -d "dist/PP6ImportBuilder/_internal"
            echo "Windows 产物结构正常：exe + _internal 齐全"
          else
            test -f "dist/PP6 Studio.app/Contents/MacOS/PP6ImportBuilder"
            echo "macOS 产物结构正常：.app 内可执行文件存在"
          fi

      - name: 冒烟测试（macOS）
        if: runner.os == 'macOS'
        run: |
          "./${{ matrix.folder }}/Contents/MacOS/PP6ImportBuilder" --headless --port 8899 &
          for i in $(seq 1 15); do
            sleep 2
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8899/api/template || true)
            [ "$code" = "200" ] && echo "冒烟测试通过" && exit 0
          done
          echo "冒烟测试失败：未能返回 HTTP 200" && exit 1

      # Windows 上 exe 没打包成，后面传上去的就是个空壳。
      # 所以先真启动一次、请求一个接口，拿到 200 才继续。
      - name: 冒烟测试（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "dist/PP6ImportBuilder/PP6ImportBuilder.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--headless","--port","8899" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 15; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8899/api/template" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Error "冒烟测试失败：exe 未能提供 HTTP 200"; exit 1 }
          Write-Host "冒烟测试通过：exe 启动后 /api/template 返回 200"

      # 上面的 --headless 只验证了服务能起，绕过了 GUI —— 而用户双击走的正是 GUI 路径。
      # 这一步专门测默认启动路径（Windows 上即浏览器模式），断言它真能走到「浏览器模式已启动」。
      - name: 冒烟测试（Windows 默认启动路径）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "dist/PP6ImportBuilder/PP6ImportBuilder.exe"
          $log = Join-Path $env:USERPROFILE ".pp6kit\logs\app.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -ArgumentList "--port","8898" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { Write-Host "进程已退出，退出码 $($p.ExitCode)"; break }
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern "浏览器模式已启动" -Quiet)) {
              $ok = $true; break
            }
          }
          Write-Host "=== 默认启动路径日志 ==="
          if (Test-Path $log) { Get-Content $log -Tail 40 } else { Write-Host "(日志未生成)" }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Error "默认启动路径失败：40 秒内未进入浏览器模式"; exit 1 }
          Write-Host "默认启动路径通过：双击后的实际路径可用"

      # 应用窗口（--window）走 WebView2 + pythonnet，是历史上「未响应」的嫌疑段。
      # 这里只收集诊断信息、不阻断发布：runner 是 session 0，无交互桌面，
      # 窗口相关判定在这里不可靠，不能拿它卡住发布。
      - name: 诊断（Windows 应用窗口，不阻断）
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = "dist/PP6ImportBuilder/PP6ImportBuilder.exe"
          $log = Join-Path $env:USERPROFILE ".pp6kit\logs\app.log"
          $p = Start-Process -FilePath $exe -ArgumentList "--window","--port","8897" -PassThru
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { break }
          }
          $proc = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
          if ($proc) { Write-Host "进程存活，Responding=$($proc.Responding)" }
          else { Write-Host "进程已退出，退出码 $($p.ExitCode)" }
          if (Test-Path $log) { Get-Content $log -Tail 40 } else { Write-Host "(日志未生成)" }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue


      # 用 PowerShell 压缩会丢符号链接与执行位，但 Windows 产物是 onedir 目录树，
      # 没有符号链接，Compress-Archive 足够；macOS 那份必须用 ditto。
      # 说明文件用 ASCII 文件名：中文名在 Windows runner 上受控制台编码影响，易出意外。
      - name: 打 zip（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "build/WINDOWS-README.txt" -Destination "dist/PP6ImportBuilder/WINDOWS-README.txt"
          Compress-Archive -Path "dist/PP6ImportBuilder" -DestinationPath "PP6ImportBuilder-windows.zip" -Force
          Get-Item "PP6ImportBuilder-windows.zip" | Select-Object Name, Length

      - name: 打 zip（macOS）
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent "${{ matrix.folder }}" "PP6-Studio-macos.zip"
          ls -lh "PP6-Studio-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.folder }}
          retention-days: 30

      # 公开仓库的 Release 附件可匿名下载，所以把包挂在 Release 上，
      # 不依赖登录态去翻 Actions 的 Artifacts。
      # main 与 tag 都发：分支用固定的 nightly tag 滚动更新（标为 prerelease，
      # 不占 Latest）；tag 推送（v* 正式版本 / test* 测试发版）用自身 tag 名、
      # 设为 Latest。两者互不干扰。
      - name: 发布到 Release
        if: >-
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/v') ||
          startsWith(github.ref, 'refs/tags/test')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/test')) && github.ref_name || 'nightly' }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ !(startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/test')) }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/test') }}
          files: |
            PP6ImportBuilder-windows.zip
            PP6-Studio-macos.zip
          fail_on_unmatched_files: false
          generate_release_notes: true
